name: simoffice

services:
  nginx:
    image: nginx:alpine
    container_name: simoffice-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - simoffice-net
    depends_on:
      app-server:
        condition: service_healthy

  app-server:
    image: node:22-alpine
    container_name: simoffice-app-server
    # M0.0 Skeleton: Run a tiny HTTP server for nginx and healthchecks to hit.
    command: >
      node -e "
        const http = require('http');
        const server = http.createServer((req, res) => {
          res.writeHead(200);
          res.end('SimOffice App Server (Skeleton)');
        });
        server.listen(3000, () => console.log('App Server Listening on 3000'));
      "
    volumes:
      - ./content-library:/var/lib/simoffice/content-library
    networks:
      - simoffice-net
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 5s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:17-alpine
    container_name: simoffice-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-simoffice}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - simoffice-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-simoffice}"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: simoffice-valkey
    networks:
      - simoffice-net
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  sandbox-orchestrator:
    image: node:22-alpine
    container_name: simoffice-sandbox-orchestrator
    # Security Note: Mounts /var/run/docker.sock to access host Docker daemon.
    # This is effectively root-on-host access. Intended for local dev and gVisor candidate testing.
    # M0.0 Skeleton: Run a dummy server for healthchecks.
    command: >
      node -e "
        const http = require('http');
        const server = http.createServer((req, res) => {
          res.writeHead(200);
          res.end('SimOffice Sandbox Orchestrator (Skeleton)');
        });
        server.listen(8080, () => console.log('Sandbox Orchestrator Listening on 8080'));
      "
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - simoffice-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  postgres-data:
  valkey-data:

networks:
  simoffice-net:
