<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimOffice</title>
    <link rel="preload" as="image" href="/assets/login-bg.jpg" fetchpriority="high" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <!-- React shell mounts here — floats over the Babylon canvas -->
    <div id="shell-root"></div>
    <div id="uiOverlay">
      <div id="crosshair" class="hud-crosshair">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="2.5" fill="currentColor"/>
          <line x1="16" y1="4" x2="16" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="16" y1="22" x2="16" y2="28" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="4" y1="16" x2="10" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="22" y1="16" x2="28" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div id="interactionPrompt" style="display: none;" class="hud-prompt">
        <span class="hud-prompt__pulse"></span>
        <kbd class="hud-kbd hud-kbd--accent">E</kbd>
        <span class="hud-prompt__text" id="interactionPromptText">Interact</span>
      </div>
      <div id="noticeOverlay" style="display: none;"></div>
      <div id="instructions" class="hud-instructions">
        <div class="hud-instructions__group">
          <span class="hud-instructions__label">Move</span>
          <div class="hud-kbd-row">
            <kbd class="hud-kbd" data-key="w">W</kbd>
            <kbd class="hud-kbd" data-key="a">A</kbd>
            <kbd class="hud-kbd" data-key="s">S</kbd>
            <kbd class="hud-kbd" data-key="d">D</kbd>
          </div>
        </div>
        <div class="hud-instructions__divider"></div>
        <div class="hud-instructions__group">
          <span class="hud-instructions__label">Sprint</span>
          <kbd class="hud-kbd hud-kbd--wide" data-key="shift">Shift</kbd>
        </div>
        <div class="hud-instructions__divider"></div>
        <div class="hud-instructions__group">
          <span class="hud-instructions__label">Jump</span>
          <kbd class="hud-kbd hud-kbd--wide" data-key=" ">Space</kbd>
        </div>
        <div class="hud-instructions__divider"></div>
        <div class="hud-instructions__group">
          <span class="hud-instructions__label">Action</span>
          <kbd class="hud-kbd hud-kbd--accent" data-key="e">E</kbd>
        </div>
        <div class="hud-instructions__divider"></div>
        <div class="hud-instructions__group hud-instructions__group--secondary">
          <span class="hud-hint-pill"><span class="hud-dot"></span> Click to lock · ESC to release</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
