name: simoffice

services:
  nginx:
    image: nginx:alpine
    container_name: simoffice-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - simoffice-net
    depends_on:
      app-server:
        condition: service_healthy

  app-server:
    image: node:22-alpine
    container_name: simoffice-app-server
    working_dir: /usr/src/app
    command: node dist/src/main.js
    ports:
      - "3000:3000"
    volumes:
      - ./server:/usr/src/app
      - app-node-modules:/usr/src/app/node_modules
      - app-dist:/usr/src/app/dist
      - ./content-library:/var/lib/simoffice/content-library
    environment:
      ORCHESTRATOR_SECRET: ${ORCHESTRATOR_SECRET:-dev-secret}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-simoffice}
      REDIS_URL: redis://valkey:6379
    networks:
      - simoffice-net
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 5s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:17-alpine
    container_name: simoffice-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-simoffice}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - simoffice-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-simoffice}"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: simoffice-valkey
    ports:
      - "6379:6379"
    networks:
      - simoffice-net
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  sandbox-orchestrator:
    build: ./sandbox-orchestrator
    container_name: simoffice-sandbox-orchestrator
    ports:
      - "8080:8080"
    environment:
      ORCHESTRATOR_SECRET: ${ORCHESTRATOR_SECRET:-dev-secret}
      DOCKER_RUNTIME: runc
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - simoffice-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  postgres-data:
  valkey-data:
  app-node-modules:
  app-dist:

networks:
  simoffice-net:
