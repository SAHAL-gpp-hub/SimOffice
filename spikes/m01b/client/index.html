<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M0.1b - Client & Realtime Spike</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #renderCanvas {
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #uiContainer {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        font-family: monospace;
        font-size: 16px;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas" tabindex="1"></canvas>
    <div id="uiContainer">
      <div id="connStatus">Connecting to server...</div>
      <div>FPS: <span id="fps">0</span></div>
      <div id="cameraStatus">Camera: OK</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
